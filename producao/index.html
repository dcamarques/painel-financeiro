<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boonus | Acesso ao Sistema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importação do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-gray-800 font-sans min-h-screen flex items-center justify-center p-4">
    
    <div class="bg-white p-8 rounded-xl shadow-lg border border-gray-200 w-full max-w-md relative overflow-hidden">
        <!-- Barra de topo decorativa -->
        <div class="absolute top-0 left-0 w-full h-1 bg-emerald-500"></div>

        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Boonus<span class="font-light text-slate-500">.app</span></h1>
            <p class="text-sm text-slate-500 mt-2">Acesse sua conta para continuar</p>
        </div>

        <form id="login-form" onsubmit="event.preventDefault(); fazerLogin();">
            <div class="mb-5">
                <label class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
                <input type="email" id="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition" placeholder="seu@email.com">
            </div>
            
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
                <input type="password" id="senha" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition" placeholder="••••••••">
            </div>

            <button type="submit" id="btn-entrar" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-medium py-2.5 px-4 rounded-lg shadow-sm transition">
                Entrar
            </button>
            
            <!-- AQUI ESTÁ O SEU NOVO LINK INTEGRADO -->
            <div class="mt-5 text-center">
                <a href="recuperar-senha.html" class="text-sm text-slate-500 hover:text-emerald-600 font-medium transition">
                    Esqueci minha senha
                </a>
            </div>
        </form>

        <!-- Div para mensagens de erro -->
        <div id="mensagem-login" class="mt-4 text-center text-sm font-medium text-rose-600 bg-rose-50 border border-rose-200 rounded-md p-3 hidden"></div>
    </div>

    <!-- Importa a conexão com o seu banco de dados -->
    <script src="js/supabase-client.js"></script>
    
    <!-- Lógica de Autenticação -->
    <script>
        async function fazerLogin() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const btn = document.getElementById('btn-entrar');
            const msg = document.getElementById('mensagem-login');

            btn.innerText = "Autenticando...";
            btn.disabled = true;
            msg.classList.add('hidden');

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: senha
            });

            if (error) {
                msg.innerText = (error.message === "Invalid login credentials") 
                    ? "E-mail ou senha incorretos." 
                    : "Erro: " + error.message;
                msg.classList.remove('hidden');
                btn.innerText = "Entrar";
                btn.disabled = false;
            } else {
                window.location.replace('dashboard.html');
            }
        }
    </script>
</body>
</html>
