<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Financeiro - Login</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <!-- Título do App -->
            <h1 class="brand-title">Fin<span>Sync</span></h1>
            <p class="subtitle">Gestão Patrimonial Inteligente</p>

            <!-- Formulário de Login (Email e Senha) -->
            <div id="login-form" class="step-active">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
                
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="••••••••" autocomplete="current-password">
                
                <button onclick="fazerLogin()" class="btn-primary">Entrar no Painel</button>
                
                <!-- Botões secundários (apenas visuais por enquanto) -->
                <button class="btn-text" style="margin-top: 15px;">Esqueci minha senha</button>
                <button class="btn-text" style="margin-top: 5px;">Criar uma nova conta</button>
            </div>
        </div>
    </div>

    <!-- Script para verificar preenchimento e redirecionar -->
    <script>
        function fazerLogin() {
            // Captura o que foi digitado
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            // Verifica se os campos não estão vazios
            if (email === "" || senha === "") {
                alert("Por favor, preencha o e-mail e a senha para acessar.");
                return; // Para a execução se estiver vazio
            }

            // Se estiver preenchido, redireciona para o Dashboard
            // Nota: Certifique-se de que o arquivo dashboard.html já está na mesma pasta no GitHub
            window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
