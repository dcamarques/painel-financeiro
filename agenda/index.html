<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda | Boonus</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-color: #000000; --text-color: #ffffff; --primary: #4CAF50; --btn-dark: #222222; --card-bg: #2a2a2a; }
        * { box-sizing: border-box; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; height: 100vh; overflow: hidden; }

        /* --- LOGIN --- */
        .login-wrapper { display: flex; justify-content: center; align-items: center; height: 100vh; width: 100vw; }
        .login-container { background: #1e1e1e; padding: 30px; border-radius: 10px; text-align: center; width: 100%; max-width: 400px; }
        .login-container input { width: 90%; padding: 15px; margin: 10px 0; border: none; border-radius: 5px; background: #333; color: white; font-size: 16px; }
        .login-container button { width: 100%; padding: 15px; background: var(--primary); color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; transition: opacity 0.3s ease; }
        .login-container button:disabled { cursor: not-allowed; }

        /* --- DASHBOARD --- */
        #painel { display: none; height: 100vh; flex-direction: column; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 20px; border-bottom: 2px solid var(--primary); background-color: var(--bg-color); }
        .header-left, .header-right, .header-center { display: flex; align-items: center; gap: 10px; }
        
        .nav-btn { background: var(--btn-dark); color: white; border: 1px solid #444; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .nav-btn:hover { background: #333; }
        .nav-btn.active-filter { background: var(--primary); border-color: var(--primary); color: white; box-shadow: 0 0 10px rgba(76, 175, 80, 0.3); }

        .btn-action { background: #0078D7; }
        .btn-action:hover { background: #005A9E; }
        .header-center h3 { margin: 0; padding: 0 15px; text-transform: uppercase; cursor: pointer; transition: color 0.2s;}
        .header-center h3:hover { color: var(--primary); }

        .main-content { display: flex; flex: 1; overflow: hidden; }
        
        /* PAINEL ESQUERDO (Notícias ou Alertas) */
        .left-panel { width: 60%; padding: 30px; border-right: 1px solid #333; display: flex; flex-direction: column; }
        #left-panel-title { margin-top: 0; margin-bottom: 30px; font-weight: normal; text-align: center; font-size: 1.5em; letter-spacing: 1px; transition: color 0.3s; }
        
        #news-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .news-slide { width: 100%; max-width: 800px; display: flex; flex-direction: column; align-items: center; text-align: center; animation: fadeIn 1s ease-in-out; }
        .news-image { max-width: 100%; max-height: 40vh; border-radius: 12px; margin-bottom: 20px; object-fit: cover; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .news-title { font-size: 1.8em; font-weight: bold; margin-bottom: 15px; color: #fff; line-height: 1.3; }
        .news-meta { font-size: 1em; color: var(--primary); font-weight: bold; text-transform: uppercase; letter-spacing: 2px;}

        /* CARD GIGANTE (Alerta) */
        #alert-container { display: none; flex: 1; flex-direction: column; justify-content: center; align-items: center; animation: pulseRed 2s infinite; }
        .giant-card { background: #F44336; width: 80%; padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 15px 30px rgba(244, 67, 54, 0.4); }
        .giant-time { font-size: 2em; font-weight: bold; margin-bottom: 10px; }
        .giant-title { font-size: 3em; font-weight: bold; margin-bottom: 40px; line-height: 1.2; text-transform: uppercase; }
        .giant-actions { display: flex; gap: 20px; justify-content: center; }
        .giant-btn { padding: 15px 30px; font-size: 1.2em; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: 0.2s;}
        .giant-btn:hover { transform: scale(1.05); }
        .btn-concluir-gigante { background: white; color: #F44336; }
        .btn-adiar-gigante { background: #222; color: white; border: 2px solid white; }
        .btn-editar-gigante { background: #444; color: white; }

        @keyframes fadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
        @keyframes pulseRed { 0% { box-shadow: inset 0 0 0px rgba(244, 67, 54, 0); } 50% { box-shadow: inset 0 0 50px rgba(244, 67, 54, 0.2); } 100% { box-shadow: inset 0 0 0px rgba(244, 67, 54, 0); } }

        /* TAREFAS */
        .tasks-panel { 
            width: 40%; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; 
            -ms-overflow-style: none; scrollbar-width: none; 
        }
        .tasks-panel::-webkit-scrollbar { display: none; } 

        .task-card { background: var(--card-bg); border-radius: 8px; display: flex; flex-direction: column; padding: 15px; position: relative; border: 1px solid transparent; transition: opacity 0.3s; }
        .task-card.is-priority { border-color: #FFEB3B; background: #332f1a; }
        .priority-icon { color: #FFEB3B; margin-right: 8px; font-size: 1.2em; text-shadow: 0 0 5px rgba(255,235,59,0.5); }
        .task-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.9em; color: #bbb;}
        .task-cat-name { font-weight: bold; letter-spacing: 1px; display: flex; align-items: center;}
        .task-title { font-size: 1.1em; font-weight: bold; margin-bottom: 15px; }
        .task-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .t-btn { background: #444; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 0.9em; font-weight: bold; }
        .t-btn:hover { background: #555; }
        .t-btn.done { background: var(--primary); }
        .t-btn.snooze { background: #ff9800; color: #000; }

        /* STATUS BADGE */
        .status-badge { padding: 3px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold; text-transform: uppercase; }
        .status-pendente { background-color: #F44336; color: white; }
        .status-andamento { background-color: #FFEB3B; color: black; }
        .status-concluido { background-color: #4CAF50; color: white; }

        /* MODAIS */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: #222; padding: 25px; border-radius: 10px; width: 400px; border: 1px solid #444; max-height: 90vh; overflow-y: auto; }
        .modal-content h3 { margin-top: 0; }
        .modal-content label { display: block; margin-top: 15px; font-size: 0.9em; color: #ccc; }
        .modal-content input[type="text"], .modal-content input[type="datetime-local"], .modal-content select { width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px; border: 1px solid #555; background: #111; color: white; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        
        .color-palette { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .color-swatch { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .color-swatch.selected { border-color: white; transform: scale(1.1); }
        .cat-list-item { display: flex; justify-content: space-between; align-items: center; background: #333; padding: 8px 12px; margin-top: 8px; border-radius: 5px; }
        .cat-list-color { width: 15px; height: 15px; border-radius: 50%; display: inline-block; margin-right: 10px; vertical-align: middle; }
        
        @media (max-width: 768px) {
            .left-panel { display: none; }
            .tasks-panel { width: 100%; }
            .header { flex-direction: column; gap: 15px; }
            .header-center { order: -1; }
        }
    </style>
</head>
<body>

    <div id="login-wrapper" class="login-wrapper">
        <div id="login-screen" class="login-container">
            <h2>Acesso à Agenda</h2>
            <p>Digite seu e-mail para receber o código de acesso.</p>
            <input type="email" id="email-input" placeholder="seu@email.com">
            <button onclick="enviarCodigo()">Enviar Código</button>
        </div>
    </div>

    <div id="painel">
        <div class="header">
            <div class="header-left">
                <button class="nav-btn" id="btn-filtro-vencidas" onclick="definirFiltro('VENCIDAS')">VENCIDAS</button>
                <button class="nav-btn" id="btn-filtro-pendentes" onclick="definirFiltro('PENDENTES')">PENDENTES</button>
                <button class="nav-btn" id="btn-filtro-prioridades" onclick="definirFiltro('PRIORIDADES')">PRIORIDADES</button>
            </div>
            <div class="header-center">
                <button class="nav-btn" onclick="mudarData(-1)">&lt;</button>
                <h3 id="display-data" onclick="mudarData('hoje')" title="Clique para voltar para Hoje"></h3>
                <button class="nav-btn" onclick="mudarData(1)">&gt;</button>
            </div>
            <div class="header-right">
                <button class="nav-btn btn-action" onclick="abrirModalTarefa()">[+] NOVA TAREFA</button>
                <button class="nav-btn" onclick="abrirModalConfig()">⚙️ CONFIGURAÇÕES</button>
                <button class="nav-btn" onclick="toggleFullScreen()">[ ] TELA CHEIA</button>
                <button class="nav-btn" style="background: darkred;" onclick="fazerLogout()">SAIR</button>
            </div>
        </div>

        <div class="main-content">
            <div class="left-panel" id="left-panel">
                <h2 id="left-panel-title">RADAR DE NOTÍCIAS</h2>
                
                <div id="news-container"><p style="text-align:center; color:#555;">Sintonizando radares...</p></div>
                
                <div id="alert-container">
                    <div class="giant-card" id="giant-card">
                        <div class="giant-time" id="giant-time">11:00</div>
                        <div class="giant-title" id="giant-title">LIGAR PARA FULANO</div>
                        <div class="giant-actions">
                            <button class="giant-btn btn-editar-gigante" onclick="editarTarefaGigante()">✎ EDITAR</button>
                            <button class="giant-btn btn-adiar-gigante" onclick="adiarTarefaGigante()">⏰ +10 MIN ADIAR</button>
                            <button class="giant-btn btn-concluir-gigante" onclick="concluirTarefaGigante()">✓ CONCLUIR</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="tasks-panel" id="tasks-container">
                <!-- Renderizado via JavaScript -->
            </div>
        </div>
    </div>

    <!-- MODAL DE TAREFA -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal-content">
            <h3 id="modal-title">Nova Tarefa</h3>
            <input type="hidden" id="task-id">
            <label>O que precisa ser feito?</label>
            <input type="text" id="task-title-input" placeholder="Ex: Ligar para Fulano">
            <label>Categoria</label>
            <select id="task-category-select"></select>
            <label>Status</label>
            <select id="task-status">
                <option value="Pendente" style="color: #F44336; font-weight: bold;">Pendente (Vermelho)</option>
                <option value="Em andamento" style="color: #FFEB3B; font-weight: bold;">Em andamento (Amarelo)</option>
                <option value="Concluido" style="color: #4CAF50; font-weight: bold;">Concluído (Verde)</option>
            </select>
            <label>Data e Hora</label>
            <input type="datetime-local" id="task-date">
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer; margin-top: 20px; background: #333; padding: 10px; border-radius: 5px; border-left: 4px solid #FFEB3B;">
                <input type="checkbox" id="task-priority" style="width: 20px; height: 20px; margin: 0;">
                <strong style="color: white;">Marcar como Prioridade Urgente</strong>
            </label>
            
            <div class="modal-actions" style="justify-content: space-between; margin-top: 30px;">
                <button class="nav-btn" style="background: darkred; display: none;" id="btn-excluir-tarefa" onclick="excluirTarefa()">Excluir</button>
                <div style="display: flex; gap: 10px;">
                    <button class="nav-btn" onclick="fecharModais()">Cancelar</button>
                    <button class="nav-btn btn-action" onclick="salvarTarefaDB()" id="btn-salvar-tarefa">Salvar Tarefa</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DE CONFIGURAÇÕES -->
    <div class="modal-overlay" id="configModal">
        <div class="modal-content">
            <h3>Configurações de Categorias</h3>
            <div id="categories-list" style="margin-bottom: 20px;"></div>
            <hr style="border: 0; border-top: 1px solid #444; margin: 20px 0;">
            <h4>Criar Nova Categoria</h4>
            <label>Nome da Categoria</label>
            <input type="text" id="new-cat-name" placeholder="Ex: Visita">
            <label>Cor de Identificação</label>
            <div class="color-palette" id="color-picker"></div>
            <input type="hidden" id="selected-color" value="#F44336">
            <div class="modal-actions">
                <button class="nav-btn" onclick="fecharModais()">Fechar</button>
                <button class="nav-btn btn-action" id="btn-add-cat" onclick="adicionarCategoriaDB()">Adicionar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kafmnasrqcmbzvzaggap.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_k4w2E4ur7xJR6qd575inBA_sJoXqHoN';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        let currentUser = null;
        let filtroAtual = 'TODAS'; 
        let tarefasGlobais = [];
        let categoriasGlobais = [];
        const defaultColors = ['#F44336','#4CAF50','#2196F3','#FFEB3B','#FF9800','#00BCD4','#9C27B0','#E91E63','#795548','#9E9E9E'];
        
        // NAVEGAÇÃO DE DATAS
        let dataPointer = new Date();
        function atualizarDisplayData() {
            const hoje = new Date();
            const isHoje = dataPointer.getDate() === hoje.getDate() && dataPointer.getMonth() === hoje.getMonth() && dataPointer.getFullYear() === hoje.getFullYear();
            const opcoes = { day: 'numeric', month: 'long', year: isHoje ? undefined : 'numeric' };
            const textoData = dataPointer.toLocaleDateString('pt-BR', opcoes).toUpperCase();
            document.getElementById('display-data').innerText = isHoje ? `HOJE, ${textoData}` : textoData;
        }
        function mudarData(acao) {
            if (acao === 'hoje') dataPointer = new Date(); else dataPointer.setDate(dataPointer.getDate() + acao);
            atualizarDisplayData(); renderizarTarefas();
        }

        // --- AUTENTICAÇÃO ---
        async function enviarCodigo() {
            const email = document.getElementById('email-input').value;
            if(!email) return alert('Digite um e-mail válido.');
            const btn = document.querySelector('#login-screen button');
            const textoOriginal = btn.innerText; btn.innerText = 'Enviando...'; btn.disabled = true; btn.style.opacity = '0.7';

            const { error } = await supabaseClient.auth.signInWithOtp({ email: email, options: { emailRedirectTo: window.location.href } });
            btn.innerText = textoOriginal; btn.disabled = false; btn.style.opacity = '1';
            if (error) alert('Erro: ' + error.message); else alert('Código enviado! Verifique sua caixa de entrada.');
        }

        async function checarSessao() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('login-wrapper').style.display = 'none';
                document.getElementById('painel').style.display = 'flex';
                
                atualizarDisplayData();
                inicializarPaletaDeCores(); 
                carregarNoticias(); 
                await carregarCategoriasDB();
                await carregarTarefasDB(); 
                
                // Liga o Motor de Alertas (A cada 30 segundos)
                setInterval(motorDeAlertas, 30000);
            }
        }
        async function fazerLogout() { await supabaseClient.auth.signOut(); window.location.reload(); }

        // --- MOTOR DE ALERTAS (CARD GIGANTE) ---
        let tarefaAlertaAtual = null;

        function motorDeAlertas() {
            const agora = new Date();
            
            // Procura tarefas que já venceram e NÃO estão concluídas
            const tarefasAtrasadas = tarefasGlobais.filter(t => {
                if(t.status === 'Concluido') return false;
                const d = new Date(t.data_agendamento);
                return d <= agora;
            }).sort((a,b) => new Date(a.data_agendamento) - new Date(b.data_agendamento)); 

            if(tarefasAtrasadas.length > 0) {
                const proximaAlerta = tarefasAtrasadas[0];
                if(!tarefaAlertaAtual || tarefaAlertaAtual.id !== proximaAlerta.id) {
                    dispararAlertaGigante(proximaAlerta);
                }
            } else {
                desligarAlertaGigante();
            }
        }

        function dispararAlertaGigante(tarefa) {
            tarefaAlertaAtual = tarefa;
            
            document.getElementById('news-container').style.display = 'none';
            document.getElementById('alert-container').style.display = 'flex';
            
            const tituloPanel = document.getElementById('left-panel-title');
            tituloPanel.innerText = '⚠️ ATENÇÃO À AGENDA ⚠️';
            tituloPanel.style.color = '#F44336';
            tituloPanel.style.fontWeight = 'bold';

            const cor = (categoriasGlobais.find(c => c.nome === tarefa.categoria) || {}).cor || '#F44336';
            document.getElementById('giant-card').style.backgroundColor = cor;
            document.getElementById('giant-title').innerText = tarefa.titulo;
            
            const hora = new Date(tarefa.data_agendamento).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
            document.getElementById('giant-time').innerText = `${tarefa.categoria.toUpperCase()} | ${hora}`;
        }

        function desligarAlertaGigante() {
            tarefaAlertaAtual = null;
            document.getElementById('alert-container').style.display = 'none';
            document.getElementById('news-container').style.display = 'flex';
            
            const tituloPanel = document.getElementById('left-panel-title');
            tituloPanel.innerText = 'RADAR DE NOTÍCIAS';
            tituloPanel.style.color = 'white';
            tituloPanel.style.fontWeight = 'normal';
        }

        async function concluirTarefaGigante() {
            if(!tarefaAlertaAtual) return;
            const btn = document.querySelector('.btn-concluir-gigante'); btn.innerText = '...';
            await concluirTarefaDB(tarefaAlertaAtual.id);
            btn.innerText = '✓ CONCLUIR';
            motorDeAlertas(); 
        }

        async function adiarTarefaGigante() {
            if(!tarefaAlertaAtual) return;
            const btn = document.querySelector('.btn-adiar-gigante'); btn.innerText = '...';
            await adiarTarefaDB(tarefaAlertaAtual.id, tarefaAlertaAtual.data_agendamento);
            btn.innerText = '⏰ +10 MIN ADIAR';
            motorDeAlertas(); 
        }

        function editarTarefaGigante() {
            if(!tarefaAlertaAtual) return;
            abrirModalTarefa(
                tarefaAlertaAtual.id, 
                tarefaAlertaAtual.titulo.replace(/'/g, "\\'"), 
                tarefaAlertaAtual.categoria, 
                tarefaAlertaAtual.status, 
                tarefaAlertaAtual.data_agendamento, 
                tarefaAlertaAtual.prioridade
            );
        }

        // --- INTEGRAÇÃO SUPABASE: CATEGORIAS E TAREFAS ---
        async function carregarCategoriasDB() {
            const { data, error } = await supabaseClient.from('categorias').select('*').order('criado_em', { ascending: true });
            if (error) { console.error('Erro ao buscar categorias:', error); return; }
            if (data.length === 0) {
                const catPadrao = [{ id_usuario: currentUser.id, nome: 'Reunir', cor: '#FF9800' }, { id_usuario: currentUser.id, nome: 'Ligar', cor: '#00BCD4' }];
                await supabaseClient.from('categorias').insert(catPadrao);
                const { data: newData } = await supabaseClient.from('categorias').select('*').order('criado_em', { ascending: true });
                categoriasGlobais = newData || [];
            } else { categoriasGlobais = data; }
            renderizarListaConfigCategorias(); renderizarSelectCategorias();
        }

        async function adicionarCategoriaDB() {
            const nome = document.getElementById('new-cat-name').value.trim(); const cor = document.getElementById('selected-color').value;
            if(!nome) return alert('Digite o nome da categoria.');
            if(categoriasGlobais.find(c => c.nome.toLowerCase() === nome.toLowerCase())) return alert('Categoria já existe.');
            document.getElementById('btn-add-cat').innerText = 'Salvando...';
            const { error } = await supabaseClient.from('categorias').insert([{ id_usuario: currentUser.id, nome, cor }]);
            document.getElementById('btn-add-cat').innerText = 'Adicionar';
            if(error) alert('Erro ao salvar: ' + error.message); else { document.getElementById('new-cat-name').value = ''; await carregarCategoriasDB(); renderizarTarefas(); }
        }

        async function removerCategoriaDB(id) {
            if(categoriasGlobais.length <= 1) return alert('Você precisa ter pelo menos uma categoria.');
            if(!confirm('Tem certeza que deseja excluir esta categoria?')) return;
            const { error } = await supabaseClient.from('categorias').delete().eq('id', id);
            if(error) alert('Erro ao excluir: ' + error.message); else { await carregarCategoriasDB(); renderizarTarefas(); }
        }

        async function carregarTarefasDB() {
            const container = document.getElementById('tasks-container');
            const { data, error } = await supabaseClient.from('tarefas').select('*').order('data_agendamento', { ascending: true });
            if (error) { container.innerHTML = '<p style="color:red;">Erro ao carregar tarefas.</p>'; return; }
            tarefasGlobais = data;
            renderizarTarefas();
            motorDeAlertas(); 
        }

        async function salvarTarefaDB() {
            const id = document.getElementById('task-id').value;
            const titulo = document.getElementById('task-title-input').value;
            const categoria = document.getElementById('task-category-select').value;
            const status = document.getElementById('task-status').value;
            const dataInput = document.getElementById('task-date').value;
            const prioridade = document.getElementById('task-priority').checked;
            
            if(!titulo || !dataInput) return alert('Preencha o que precisa ser feito e a data.');
            
            const dataSelecionada = new Date(dataInput);
            const hoje = new Date();
            
            // Zera as horas para comparar estritamente os DIAS do calendário
            hoje.setHours(0, 0, 0, 0);
            const diaSelecionado = new Date(dataSelecionada);
            diaSelecionado.setHours(0, 0, 0, 0);
            
            // TRAVA DE SEGURANÇA (Prevenção de DIAS no passado)
            if (!id) {
                if (diaSelecionado < hoje) {
                    return alert('⚠️ TRAVA DE SEGURANÇA: Não é possível incluir uma nova tarefa em um dia que já passou.');
                }
            } else {
                if (diaSelecionado < hoje && status !== 'Concluido') {
                    const confirmar = confirm('⚠️ ATENÇÃO: Você está movendo esta tarefa para um dia no passado. Deseja continuar?');
                    if (!confirmar) return;
                }
            }

            const dataIso = dataSelecionada.toISOString();
            document.getElementById('btn-salvar-tarefa').innerText = 'Salvando...';
            
            if (id) await supabaseClient.from('tarefas').update({ titulo, categoria, status, data_agendamento: dataIso, prioridade }).eq('id', id);
            else await supabaseClient.from('tarefas').insert([{ id_usuario: currentUser.id, titulo, categoria, status, data_agendamento: dataIso, prioridade }]);
            
            document.getElementById('btn-salvar-tarefa').innerText = 'Salvar Tarefa';
            fecharModais(); await carregarTarefasDB(); 
        }

        async function excluirTarefa() {
            const id = document.getElementById('task-id').value; if(!id) return;
            if(!confirm('Tem certeza que deseja apagar?')) return;
            document.getElementById('btn-excluir-tarefa').innerText = 'Excluindo...';
            await supabaseClient.from('tarefas').delete().eq('id', id);
            fecharModais(); await carregarTarefasDB(); 
        }

        async function concluirTarefaDB(id) {
            document.getElementById('task-'+id).style.opacity = '0.3';
            await supabaseClient.from('tarefas').update({ status: 'Concluido' }).eq('id', id);
            await carregarTarefasDB(); 
        }

        async function adiarTarefaDB(id, dataAtualBanco) {
            document.getElementById('task-'+id).style.opacity = '0.5';
            const dataObj = new Date(dataAtualBanco); dataObj.setMinutes(dataObj.getMinutes() + 10);
            await supabaseClient.from('tarefas').update({ data_agendamento: dataObj.toISOString() }).eq('id', id);
            await carregarTarefasDB(); 
        }

        function renderizarTarefas() {
            const container = document.getElementById('tasks-container'); container.innerHTML = '';
            const agora = new Date();
            let tarefasFiltradas = tarefasGlobais;

            if (filtroAtual === 'VENCIDAS') {
                tarefasFiltradas = tarefasGlobais.filter(t => new Date(t.data_agendamento) < agora && t.status !== 'Concluido');
            } else {
                tarefasFiltradas = tarefasGlobais.filter(t => {
                    const d = new Date(t.data_agendamento);
                    return d.getDate() === dataPointer.getDate() && d.getMonth() === dataPointer.getMonth() && d.getFullYear() === dataPointer.getFullYear();
                });
                if (filtroAtual === 'PRIORIDADES') tarefasFiltradas = tarefasFiltradas.filter(t => t.prioridade === true);
                else if (filtroAtual === 'PENDENTES') tarefasFiltradas = tarefasFiltradas.filter(t => t.status === 'Pendente' || t.status === 'Em andamento');
            }

            if(tarefasFiltradas.length === 0) { container.innerHTML = `<div style="text-align: center; color: #777; margin-top: 50px;">Agenda limpa.</div>`; return; }

            tarefasFiltradas.forEach(t => {
                const cor = (categoriasGlobais.find(c => c.nome === t.categoria) || {}).cor || '#555';
                const statusClass = t.status === 'Concluido' ? 'status-concluido' : (t.status === 'Em andamento' ? 'status-andamento' : 'status-pendente');
                const dataFormatada = new Date(t.data_agendamento).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
                const prioridadeHTML = t.prioridade ? `<span class="priority-icon">⭐</span>` : '';
                const cardClass = t.prioridade ? 'task-card is-priority' : 'task-card';

                container.innerHTML += `
                    <div class="${cardClass}" style="border-left: 8px solid ${cor};" id="task-${t.id}">
                        <div class="task-header"><span class="task-cat-name" style="color: ${cor};">${prioridadeHTML} ${t.categoria.toUpperCase()}</span><strong>${dataFormatada}</strong><span class="status-badge ${statusClass}">${t.status.toUpperCase()}</span></div>
                        <div class="task-title">${t.titulo}</div>
                        <div class="task-actions">
                            <button class="t-btn" onclick="abrirModalTarefa('${t.id}', '${t.titulo.replace(/'/g, "\\'")}', '${t.categoria}', '${t.status}', '${t.data_agendamento}', ${t.prioridade})">✎ Editar</button>
                            <button class="t-btn snooze" onclick="adiarTarefaDB('${t.id}', '${t.data_agendamento}')">+10m Adiar</button>
                            <button class="t-btn done" onclick="concluirTarefaDB('${t.id}')">✓ Concluir</button>
                        </div>
                    </div>
                `;
            });
        }

        // --- SISTEMA DE NOTÍCIAS (TV CAROUSEL) ---
        let noticiasGlobais = []; let indiceNoticiaAtual = 0; let loopNoticias;
        async function carregarNoticias() {
            try {
                const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.infomoney.com.br/feed/');
                const data = await response.json();
                noticiasGlobais = data.items.map(item => {
                    let imgSrc = item.thumbnail || (item.enclosure && item.enclosure.link) || '';
                    if (!imgSrc) { const match = item.content.match(/<img[^>]+src="([^">]+)"/) || item.description.match(/<img[^>]+src="([^">]+)"/); if (match) imgSrc = match[1]; }
                    return { titulo: item.title, imagem: imgSrc, dataPub: new Date(item.pubDate).toLocaleDateString('pt-BR') };
                });
                if (noticiasGlobais.length > 0) {
                    indiceNoticiaAtual = 0; renderizarNoticiaSlide();
                    if(loopNoticias) clearInterval(loopNoticias);
                    loopNoticias = setInterval(proximaNoticia, 15000);
                }
            } catch (error) { document.getElementById('news-container').innerHTML = '<p style="color:red;">Erro ao carregar radares.</p>'; }
        }
        function renderizarNoticiaSlide() {
            if(tarefaAlertaAtual) return; 
            const container = document.getElementById('news-container'); const noticia = noticiasGlobais[indiceNoticiaAtual]; if(!noticia) return;
            const htmlImagem = noticia.imagem ? `<img src="${noticia.imagem}" class="news-image" alt="Imagem destaque">` : '';
            container.innerHTML = `<div class="news-slide">${htmlImagem}<div class="news-title">${noticia.titulo}</div><div class="news-meta">FONTE: INFOMONEY | ${noticia.dataPub}</div></div>`;
        }
        function proximaNoticia() { if(!tarefaAlertaAtual) { indiceNoticiaAtual++; if(indiceNoticiaAtual >= noticiasGlobais.length) indiceNoticiaAtual = 0; renderizarNoticiaSlide(); } }

        // --- UI AUXILIAR ---
        function definirFiltro(tipo) { if (filtroAtual === tipo) filtroAtual = 'TODAS'; else filtroAtual = tipo; document.querySelectorAll('.header-left .nav-btn').forEach(btn => btn.classList.remove('active-filter')); if(filtroAtual !== 'TODAS') document.getElementById('btn-filtro-' + tipo.toLowerCase()).classList.add('active-filter'); renderizarTarefas(); }
        function fecharModais() { document.getElementById('taskModal').style.display = 'none'; document.getElementById('configModal').style.display = 'none'; }
        
        function formatarDataParaInputHTML(dataIsoString) {
            if(!dataIsoString) {
                const agora = new Date(); const d = new Date(dataPointer); d.setHours(agora.getHours(), agora.getMinutes());
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + 'T' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
            }
            const data = new Date(dataIsoString);
            return data.getFullYear() + '-' + String(data.getMonth() + 1).padStart(2, '0') + '-' + String(data.getDate()).padStart(2, '0') + 'T' + String(data.getHours()).padStart(2, '0') + ':' + String(data.getMinutes()).padStart(2, '0');
        }

        function abrirModalTarefa(id = '', titulo = '', categoria = categoriasGlobais[0]?.nome || '', status = 'Pendente', dataIso = '', prioridade = false) {
            document.getElementById('taskModal').style.display = 'flex';
            document.getElementById('modal-title').innerText = id ? 'Editar Tarefa' : 'Nova Tarefa';
            document.getElementById('task-id').value = id;
            document.getElementById('task-title-input').value = titulo;
            document.getElementById('task-status').value = status;
            document.getElementById('task-date').value = formatarDataParaInputHTML(dataIso);
            document.getElementById('task-priority').checked = prioridade;
            document.getElementById('btn-excluir-tarefa').style.display = id ? 'block' : 'none'; 
            renderizarSelectCategorias(); document.getElementById('task-category-select').value = categoria;
        }

        function abrirModalConfig() { document.getElementById('configModal').style.display = 'flex'; renderizarListaConfigCategorias(); }
        function renderizarListaConfigCategorias() { const list = document.getElementById('categories-list'); list.innerHTML = ''; categoriasGlobais.forEach(cat => { list.innerHTML += `<div class="cat-list-item"><div><span class="cat-list-color" style="background-color: ${cat.cor};"></span><strong>${cat.nome}</strong></div><button class="t-btn" style="background: darkred;" onclick="removerCategoriaDB('${cat.id}')">Excluir</button></div>`; }); }
        function renderizarSelectCategorias() { const select = document.getElementById('task-category-select'); select.innerHTML = ''; categoriasGlobais.forEach(cat => { select.innerHTML += `<option value="${cat.nome}">${cat.nome}</option>`; }); }
        function inicializarPaletaDeCores() { const picker = document.getElementById('color-picker'); picker.innerHTML = ''; defaultColors.forEach(cor => { const div = document.createElement('div'); div.className = 'color-swatch'; div.style.backgroundColor = cor; if(cor === '#F44336') div.classList.add('selected'); div.onclick = () => selecionarCor(div, cor); picker.appendChild(div); }); }
        function selecionarCor(elemento, cor) { document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('selected')); elemento.classList.add('selected'); document.getElementById('selected-color').value = cor; }
        function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }

        checarSessao();
    </script>
</body>
</html>
