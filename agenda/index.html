<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agenda | Boonus</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --primary: #4CAF50;
            --btn-dark: #222222;
            --card-bg: #2a2a2a;
        }
        
        * { box-sizing: border-box; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
        }

        /* --- LOGIN --- */
        .login-wrapper {
            display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw;
        }
        .login-container {
            background: #1e1e1e; padding: 30px; border-radius: 10px;
            text-align: center; width: 100%; max-width: 400px;
        }
        .login-container input {
            width: 90%; padding: 15px; margin: 10px 0; border: none;
            border-radius: 5px; background: #333; color: white; font-size: 16px;
        }
        .login-container button {
            width: 100%; padding: 15px; background: var(--primary); color: white;
            border: none; border-radius: 5px; font-size: 16px; cursor: pointer;
            font-weight: bold; transition: opacity 0.3s ease;
        }
        .login-container button:disabled { cursor: not-allowed; }

        /* --- DASHBOARD --- */
        #painel { display: none; height: 100vh; flex-direction: column; }

        .header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; border-bottom: 2px solid var(--primary);
            background-color: var(--bg-color);
        }
        .header-left, .header-right, .header-center { display: flex; align-items: center; gap: 10px; }
        .nav-btn {
            background: var(--btn-dark); color: white; border: 1px solid #444;
            padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        .nav-btn:hover { background: #333; }
        .btn-action { background: #0078D7; }
        .btn-action:hover { background: #005A9E; }
        .header-center h3 { margin: 0; padding: 0 15px; }

        .main-content { display: flex; flex: 1; overflow: hidden; }
        
        /* NOTÍCIAS */
        .news-panel {
            width: 60%; padding: 20px; border-right: 1px solid #333;
            display: flex; flex-direction: column; overflow-y: auto;
        }
        .news-panel h2 { margin-top: 0; font-weight: normal; text-align: center;}
        .news-card {
            background: #1a1a1a; padding: 15px; border-radius: 8px; margin-bottom: 15px;
            border-left: 4px solid var(--primary);
        }
        .news-card h4 { margin: 0 0 10px 0; color: #ddd; }
        .news-card p { margin: 0; font-size: 0.9em; color: #aaa; }
        
        /* TAREFAS */
        .tasks-panel {
            width: 40%; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column; gap: 15px;
        }
        .task-card {
            background: var(--card-bg); border-radius: 8px;
            display: flex; flex-direction: column; padding: 15px; position: relative;
        }
        .task-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9em; color: #bbb;}
        .task-title { font-size: 1.1em; font-weight: bold; margin-bottom: 15px; }
        .task-actions { display: flex; gap: 10px; justify-content: flex-end; }
        .t-btn {
            background: #444; color: white; border: none; padding: 8px 12px;
            border-radius: 5px; cursor: pointer; font-size: 0.9em; font-weight: bold;
        }
        .t-btn:hover { background: #555; }
        .t-btn.done { background: var(--primary); }
        .t-btn.snooze { background: #ff9800; color: #000; }

        /* MODAL DE TAREFAS */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #222; padding: 25px; border-radius: 10px; width: 400px;
            border: 1px solid #444;
        }
        .modal-content h3 { margin-top: 0; }
        .modal-content label { display: block; margin-top: 15px; font-size: 0.9em; color: #ccc; }
        .modal-content input, .modal-content select {
            width: 100%; padding: 10px; margin-top: 5px; border-radius: 5px;
            border: 1px solid #555; background: #111; color: white;
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        
        @media (max-width: 768px) {
            .news-panel { display: none; }
            .tasks-panel { width: 100%; }
            .header { flex-direction: column; gap: 15px; }
            .header-center { order: -1; }
        }
    </style>
</head>
<body>

    <div id="login-wrapper" class="login-wrapper">
        <div id="login-screen" class="login-container">
            <h2>Acesso à Agenda</h2>
            <p>Digite seu e-mail para receber o código de acesso.</p>
            <input type="email" id="email-input" placeholder="seu@email.com">
            <button onclick="enviarCodigo()">Enviar Código</button>
        </div>
    </div>

    <div id="painel">
        <div class="header">
            <div class="header-left">
                <button class="nav-btn">VENCIDAS</button>
                <button class="nav-btn">PENDENTES</button>
                <button class="nav-btn">PRIORIDADES</button>
            </div>
            <div class="header-center">
                <button class="nav-btn">&lt;</button>
                <h3>HOJE, 26 DE JULHO</h3>
                <button class="nav-btn">&gt;</button>
            </div>
            <div class="header-right">
                <button class="nav-btn btn-action" onclick="abrirModal()">[+] NOVA TAREFA</button>
                <button class="nav-btn" onclick="toggleFullScreen()">[ ] TELA CHEIA</button>
                <button class="nav-btn" style="background: darkred;" onclick="fazerLogout()">SAIR</button>
            </div>
        </div>

        <div class="main-content">
            <div class="news-panel">
                <h2>RADAR DE NOTÍCIAS</h2>
                <div id="news-container">
                    <p style="text-align:center; color:#555;">Carregando radar de mercado...</p>
                </div>
            </div>

            <div class="tasks-panel" id="tasks-container">
                <!-- As tarefas renderizadas via JavaScript aparecerão aqui -->
            </div>
        </div>
    </div>

    <!-- MODAL DE CRIAR/EDITAR TAREFA -->
    <div class="modal-overlay" id="taskModal">
        <div class="modal-content">
            <h3 id="modal-title">Nova Tarefa</h3>
            <input type="hidden" id="task-id">
            
            <label>O que precisa ser feito?</label>
            <input type="text" id="task-title-input" placeholder="Ex: Ligar para Fulano">
            
            <label>Categoria (Cor)</label>
            <select id="task-category">
                <option value="Ligar">Ligar (Vermelho)</option>
                <option value="Visita">Visita (Vermelho)</option>
                <option value="Aplicar">Aplicar (Amarelo)</option>
                <option value="Negociar">Negociar (Amarelo)</option>
                <option value="Realocar">Realocar (Verde)</option>
            </select>

            <label>Data e Hora</label>
            <input type="datetime-local" id="task-date">

            <div class="modal-actions">
                <button class="nav-btn" onclick="fecharModal()">Cancelar</button>
                <button class="nav-btn btn-action" onclick="salvarTarefa()">Salvar</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://kafmnasrqcmbzvzaggap.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_k4w2E4ur7xJR6qd575inBA_sJoXqHoN';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentUser = null;

        // --- AUTENTICAÇÃO ---
        async function enviarCodigo() {
            const email = document.getElementById('email-input').value;
            if(!email) return alert('Digite um e-mail válido.');
            const btn = document.querySelector('#login-screen button');
            const textoOriginal = btn.innerText;
            btn.innerText = 'Enviando...'; btn.disabled = true; btn.style.opacity = '0.7';

            const { error } = await supabaseClient.auth.signInWithOtp({
                email: email, options: { emailRedirectTo: window.location.href }
            });

            btn.innerText = textoOriginal; btn.disabled = false; btn.style.opacity = '1';
            if (error) alert('Erro: ' + error.message);
            else alert('Código enviado! Verifique sua caixa de entrada.');
        }

        async function checarSessao() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('login-wrapper').style.display = 'none';
                document.getElementById('painel').style.display = 'flex';
                carregarNoticias();
                carregarTarefasFalsas(); // Placeholder visual até termos o banco
            }
        }

        async function fazerLogout() { await supabaseClient.auth.signOut(); window.location.reload(); }

        // --- NOTÍCIAS (RSS Bypass) ---
        async function carregarNoticias() {
            const container = document.getElementById('news-container');
            try {
                // Usando rss2json para bypass do bloqueio CORS puxando feed financeiro
                const response = await fetch('https://api.rss2json.com/v1/api.json?rss_url=https://www.infomoney.com.br/feed/');
                const data = await response.json();
                
                container.innerHTML = '';
                data.items.slice(0, 8).forEach(item => {
                    container.innerHTML += `
                        <div class="news-card">
                            <h4>${item.title}</h4>
                            <p>Fonte: InfoMoney | ${new Date(item.pubDate).toLocaleDateString('pt-BR')}</p>
                        </div>
                    `;
                });
            } catch (error) {
                container.innerHTML = '<p style="color:red;">Erro ao carregar radar de notícias.</p>';
            }
        }

        // --- GESTÃO DE TAREFAS (UI Base) ---
        const coresCategoria = {
            'Ligar': '#f44336', 'Visita': '#f44336',
            'Aplicar': '#ffcc00', 'Negociar': '#ffcc00',
            'Realocar': '#4CAF50'
        };

        function carregarTarefasFalsas() {
            // Isso serve apenas para você visualizar como o card funcionará antes de conectarmos o banco
            const container = document.getElementById('tasks-container');
            container.innerHTML = renderizarCard('1', 'Ligar para Fulano', 'Ligar', '2026-07-26T11:00');
            container.innerHTML += renderizarCard('2', 'Realocar saldo da conta', 'Realocar', '2026-07-26T15:00');
        }

        function renderizarCard(id, titulo, categoria, data) {
            const cor = coresCategoria[categoria] || '#555';
            const dataFormatada = new Date(data).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
            return `
                <div class="task-card" style="border-left: 8px solid ${cor};" id="task-${id}">
                    <div class="task-header">
                        <span>${categoria.toUpperCase()}</span>
                        <strong>${dataFormatada}</strong>
                    </div>
                    <div class="task-title">${titulo}</div>
                    <div class="task-actions">
                        <button class="t-btn" onclick="abrirModal('${id}', '${titulo}', '${categoria}', '${data}')">✎ Editar</button>
                        <button class="t-btn snooze" onclick="adiarTarefa('${id}')">+10m Adiar</button>
                        <button class="t-btn done" onclick="concluirTarefa('${id}')">✓ Concluir</button>
                    </div>
                </div>
            `;
        }

        // --- CONTROLE DO MODAL ---
        function abrirModal(id = '', titulo = '', categoria = 'Ligar', data = '') {
            document.getElementById('taskModal').style.display = 'flex';
            document.getElementById('modal-title').innerText = id ? 'Editar Tarefa' : 'Nova Tarefa';
            document.getElementById('task-id').value = id;
            document.getElementById('task-title-input').value = titulo;
            document.getElementById('task-category').value = categoria;
            document.getElementById('task-date').value = data;
        }

        function fecharModal() { document.getElementById('taskModal').style.display = 'none'; }

        function salvarTarefa() {
            const titulo = document.getElementById('task-title-input').value;
            const data = document.getElementById('task-date').value;
            if(!titulo || !data) return alert('Preencha título e data.');
            
            alert('A interface visual está pronta! Para salvar os dados, precisamos criar a tabela no Supabase.');
            fecharModal();
        }

        function adiarTarefa(id) { alert('Botão de adiar pressionado. A lógica somará 10 min no banco.'); }
        function concluirTarefa(id) { alert('Tarefa marcada como concluída.'); document.getElementById('task-'+id).style.opacity = '0.3'; }
        function toggleFullScreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen(); }

        checarSessao();
    </script>
</body>
</html>
